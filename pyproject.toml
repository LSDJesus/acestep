[project]
name = "ace-step"
version = "1.5.0"
description = "ACE-Step 1.5 (inference + training core, pruned for embedding in luna-generates)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
dependencies = [
    # PyTorch / CUDA 13.0 on Linux x86_64 (single-platform target)
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "torchaudio==2.11.0+cu130",
    # Core inference deps
    "transformers>=4.51.0,<4.58.0",
    "diffusers>=0.37.0",
    "accelerate>=1.12.0",
    "safetensors>=0.7.0",
    "einops>=0.8.1",
    "loguru>=0.7.3",
    "numba>=0.63.1",
    "scipy>=1.10.1",
    "soundfile>=0.13.1",
    "matplotlib>=3.7.5",
    "diskcache",
    "toml",
    "typer-slim>=0.21.1",
    "vector-quantize-pytorch>=1.27.15",
    "pytorch-wavelets>=1.3.0",
    "pywavelets>=1.9.0",
    "xxhash",
    "torchao",
    # Training deps (kept per consolidation plan)
    "peft>=0.18.0",
    "lycoris-lora",
    "lightning>=2.0.0",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
# flash-attn is performance-only (SDPA fallback exists). Install manually with
# the wheel that matches your torch / CUDA / cpython combo, e.g.:
#   pip install "flash-attn>=2.8" --no-build-isolation
flash = ["flash-attn>=2.8"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[project.scripts]
acestep-download = "acestep.model_downloader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["acestep"]
